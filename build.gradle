plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        nexvisuals {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def resourceProperties = [version: project.version.toString(), minecraft_version: project.minecraft_version]
// Supplied clips stay out of version control. Ordinary builds use installed Minecraft event fallbacks.
def audioFallbacks = [hit_cricket:'block.chain.hit', hit_2:'block.note_block.bit', hit_critical:'block.amethyst_block.chime',
                      hitmarker:'ui.button.click', alpha_damage:'block.note_block.harp', osu:'block.note_block.bell']
def userSoundDirectory = providers.gradleProperty('userSoundResources').map { file(it).canonicalFile }.orNull
if (userSoundDirectory != null) {
    if (!userSoundDirectory.toPath().startsWith(projectDir.canonicalFile.toPath()) || userSoundDirectory == projectDir.canonicalFile)
        throw new GradleException('User sound resources must stay inside NexVisuals')
    if (!new File(userSoundDirectory, 'nexvisuals/user-audio.json').isFile())
        throw new GradleException('Prepare the local clips with tools/prepare_user_sounds.py first')
    audioFallbacks.keySet().each { name ->
        if (!new File(userSoundDirectory, 'assets/nexvisuals/sounds/user/' + name + '.ogg').isFile())
            throw new GradleException('Missing prepared user clip: ' + name)
    }
    sourceSets.main.resources.srcDir(userSoundDirectory)
}
def soundProperties = [audio_type: userSoundDirectory == null ? 'event' : 'file']
audioFallbacks.each { name, fallback -> soundProperties[name] = userSoundDirectory == null ? 'minecraft:' + fallback : 'nexvisuals:user/' + name }
processResources {
    inputs.properties resourceProperties
    inputs.properties soundProperties
    filesMatching('fabric.mod.json') {
        expand resourceProperties
    }
    filesMatching('assets/nexvisuals/sounds.json') { expand soundProperties }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
test { useJUnitPlatform() }

// Headless integration tests for actual module definitions and pinned mixin targets, without launching Minecraft.
sourceSets {
    clientTest {
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
configurations {
    clientTestImplementation.extendsFrom testImplementation
    clientTestRuntimeOnly.extendsFrom testRuntimeOnly
}
tasks.register('clientTest', Test) {
    description = 'Tests client module metadata and bytecode contracts without opening a game window.'
    testClassesDirs = sourceSets.clientTest.output.classesDirs
    classpath = sourceSets.clientTest.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
}
check.dependsOn tasks.named('clientTest')

def productionJar = tasks.named('remapJar').flatMap { it.archiveFile }
tasks.register('verifyModJar') {
    dependsOn tasks.named('remapJar')
    inputs.file(productionJar)
    doLast {
        def file = productionJar.get().asFile
        new java.util.zip.ZipFile(file).withCloseable { zip ->
            def json = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
            assert json.id == 'nexvisuals' && json.environment == 'client'
            assert json.depends.minecraft == '=1.21.11' : 'Target must remain exactly Minecraft 1.21.11'
            assert !json.entrypoints.containsKey('main') && !json.entrypoints.containsKey('server')
            def mixins = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('nexvisuals.client.mixins.json')))
            mixins.client.each { name -> assert zip.getEntry(mixins.package.replace('.', '/') + '/' + name + '.class') != null }
            ['orb', 'spark', 'ring', 'slash', 'star', 'footprint', 'heart', 'pixel'].each { shape ->
                assert zip.getEntry('assets/nexvisuals/textures/particle/' + shape + '.png') != null
            }
            ['clean', 'aurora', 'cinematic'].each { preset -> assert zip.getEntry('nexvisuals/presets/' + preset + '.json') != null }
            ['sky_dome', 'custom_stars', 'visual_grade', 'live_background', 'glow_extract'].each { shader ->
                ['vsh', 'fsh'].each { stage -> assert zip.getEntry('assets/nexvisuals/shaders/core/' + shader + '.' + stage) != null }
            }
            assert !zip.entries().toList().any { it.name.contains('Test.class') || it.name.startsWith('net/minecraft/') }
            def audio = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('assets/nexvisuals/sounds.json')))
            assert audio.size() == 6
            audioFallbacks.keySet().each { name ->
                def voice = audio['user_' + name].sounds[0]
                assert voice.type == (userSoundDirectory == null ? 'event' : 'file')
                if (userSoundDirectory != null) {
                    assert zip.getEntry('assets/nexvisuals/sounds/user/' + name + '.ogg') != null
                    assert zip.getEntry('nexvisuals/user-audio.json') != null
                }
            }
            if (userSoundDirectory == null)
                assert !zip.entries().toList().any { it.name.endsWith('.ogg') || it.name == 'nexvisuals/user-audio.json' } : 'Clean before switching audio build modes'
        }
        logger.lifecycle('Verified production mod: {} ({} bytes), Minecraft 1.21.11', file.absolutePath, file.length())
    }
}
build.dependsOn tasks.named('verifyModJar')
