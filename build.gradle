plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        nexvisuals {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def resourceProperties = [version: project.version.toString(), minecraft_version: project.minecraft_version]
processResources {
    inputs.properties resourceProperties
    filesMatching('fabric.mod.json') {
        expand resourceProperties
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
test { useJUnitPlatform() }

// Headless integration tests for actual module definitions and pinned mixin targets, without launching Minecraft.
sourceSets {
    clientTest {
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
configurations {
    clientTestImplementation.extendsFrom testImplementation
    clientTestRuntimeOnly.extendsFrom testRuntimeOnly
}
tasks.register('clientTest', Test) {
    description = 'Tests client module metadata and bytecode contracts without opening a game window.'
    testClassesDirs = sourceSets.clientTest.output.classesDirs
    classpath = sourceSets.clientTest.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
}
check.dependsOn tasks.named('clientTest')

def productionJar = tasks.named('remapJar').flatMap { it.archiveFile }
tasks.register('verifyModJar') {
    dependsOn tasks.named('remapJar')
    inputs.file(productionJar)
    doLast {
        def file = productionJar.get().asFile
        new java.util.zip.ZipFile(file).withCloseable { zip ->
            def json = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
            assert json.id == 'nexvisuals' && json.environment == 'client'
            assert json.depends.minecraft == '=1.21.11' : 'Target must remain exactly Minecraft 1.21.11'
            assert !json.entrypoints.containsKey('main') && !json.entrypoints.containsKey('server')
            def mixins = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('nexvisuals.client.mixins.json')))
            mixins.client.each { name -> assert zip.getEntry(mixins.package.replace('.', '/') + '/' + name + '.class') != null }
            ['orb', 'spark', 'ring', 'slash', 'star'].each { shape ->
                assert zip.getEntry('assets/nexvisuals/textures/particle/' + shape + '.png') != null
            }
            ['clean', 'aurora', 'cinematic'].each { preset -> assert zip.getEntry('nexvisuals/presets/' + preset + '.json') != null }
            ['sky_dome', 'custom_stars', 'visual_grade', 'live_background', 'glow_extract'].each { shader ->
                ['vsh', 'fsh'].each { stage -> assert zip.getEntry('assets/nexvisuals/shaders/core/' + shader + '.' + stage) != null }
            }
            assert !zip.entries().toList().any { it.name.contains('Test.class') || it.name.startsWith('net/minecraft/') }
        }
        logger.lifecycle('Verified production mod: {} ({} bytes), Minecraft 1.21.11', file.absolutePath, file.length())
    }
}
build.dependsOn tasks.named('verifyModJar')
